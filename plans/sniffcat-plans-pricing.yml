summary: >-
  SniffCat publishes NO priced plans. There is no /pricing page (probed, 404), no paid tier, no
  overage schedule and no enterprise contact-sales form. The homepage states the commercial position
  explicitly — "No Hidden Costs: Use SniffCat with no surprises: no charges for core features, no
  sudden limits, no hidden conditions" — and the API is marketed as "Use Our Free API". What looks
  like tiering is NOT commercial: entitlement is granted through ROLES (Individual, Early User,
  Webmaster, Contributor, SniffCat Enthusiast, Hosting Provider, ISP, Security Researcher, Law
  Enforcement), which are assigned on trust/identity rather than purchased, and which raise daily
  quotas additively. Those quotas are captured in rate-limits/sniffcat-rate-limits.yml, not here,
  because they carry no price.
