summary: >-
  SniffCat ships one registry-published client library — the Python `sniffcat` package, whose source
  repo lives in the provider's own SniffCatDB GitHub org. Everything else the provider calls an
  "integration" is a git-cloned Node.js/Shell reporting daemon, not a registry package: none of the
  four official reporter tools is published to npm (all six candidate npm names return 404), so the
  only version signal available is the version field in each repo's package.json plus the last commit
  date. Recorded as `registry: github` with the real version, rather than omitted.
