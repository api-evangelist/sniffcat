summary: >-
  SniffCat runs a real, third-party-hosted status page with per-day uptime history and an incident
  archive, and it versions the API in the URI path. It publishes NO deprecation policy, NO Sunset or
  Deprecation header contract (RFC 8594), NO SLA and NO changelog. The whole platform is
  self-labelled "Early Access" / "open beta", which is itself the clearest lifecycle statement on the
  site.
