certifications:
  claimed: []
  note: >-
    No SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP, GDPR or CCPA statement was found. There is no
    privacy policy (https://sniffcat.com/privacy -> 404) and no trust centre
    (https://trust.sniffcat.com does not resolve). The site markets a privacy POSTURE
    ("Privacy First. No telemetry, no tracking. Your queries stay private.") without a published
    privacy policy to back it — a notable gap for a service whose whole product is a database of
    IP addresses.
