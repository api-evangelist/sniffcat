generated: '2026-08-19'
method: derived
source: >-
  derived from live probes of https://api.sniffcat.com and https://sniffcat.com plus the published
  reference at https://sniffcat.com/documentation/api; no compliance or certification claims were
  found anywhere on the provider's site
summary: >-
  SniffCat conforms to two cross-cutting web standards that were verified on the wire — RFC 9116
  (security.txt) and the IETF draft RateLimit header fields — and uses ISO 3166-1 alpha-2 country
  codes and ISO 8601 timestamps in its payloads. It conforms to none of the API description or
  problem-format standards: no OpenAPI, no AsyncAPI, no JSON Schema, no RFC 9457. No security or
  privacy certification is claimed (no SOC 2, ISO 27001, PCI DSS, GDPR statement or trust centre),
  so NO Compliance pointer is emitted.
standards:
- id: rfc9116
  name: security.txt
  conforms: true
  evidence:
    url: https://sniffcat.com/.well-known/security.txt
    status: 200
    fields: [Canonical, Contact, Expires, Preferred-Languages]
    note: >-
      Served from both sniffcat.com and api.sniffcat.com, with a valid non-expired Expires
      (2030-12-10). Missing the optional Policy, Encryption, Acknowledgments and Hiring fields.
- id: ietf-ratelimit-headers
  name: draft-ietf-httpapi-ratelimit-headers
  conforms: true
  evidence:
    url: https://api.sniffcat.com/api/v1/check?ip=1.1.1.1
    status: 403
    headers:
      RateLimit: limit=400, remaining=399, reset=120
      RateLimit-Policy: 400;w=120
    note: >-
      Uses the modern single `RateLimit` field rather than the legacy X-RateLimit-* triplet. No
      Retry-After on exhaustion was observed.
- id: iso3166-1-alpha-2
  name: ISO 3166-1 alpha-2 country codes
  conforms: true
  evidence:
    url: https://sniffcat.com/documentation/api/blacklist
    note: includeCountries / excludeCountries and the `country` / `reporterCountry` response fields.
- id: iso8601
  name: ISO 8601 / RFC 3339 timestamps
  conforms: true
  evidence:
    url: https://sniffcat.com/documentation/api/blacklist
    note: 'UTC with milliseconds, e.g. 2025-06-30T12:34:56.789Z'
- id: rfc6797
  name: HTTP Strict Transport Security
  conforms: true
  evidence:
    header: 'strict-transport-security: max-age=31536000; includeSubDomains; preload'
    hosts: [sniffcat.com, api.sniffcat.com]
