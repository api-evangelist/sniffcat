summary: >-
  SniffCat publishes a complete per-role daily quota matrix — five separately metered operations
  (report, bulk, check, reports, blacklist), a base allowance every account gets, and nine additive
  role allowances on top. It also emits the IETF draft `RateLimit` / `RateLimit-Policy` header fields
  on every response, including error responses, which is the runtime signal an agent actually needs.
limit_count: 51
# 10 quota rows (base + 9 roles) x 5 metered operations = 50 documented daily limits,
# plus 1 probed 400-req/120s edge window on api.sniffcat.com.
scheme:
  model: additive
  description: >-
    Effective limit for an operation = base account limit + the limit contributed by every role the
    user holds. Users may hold multiple roles simultaneously.
  window: daily
  reset: '00:00 UTC'
  exhaustion_status: 429
  scope: per-account (token-bound), metered per operation
headers:
  observed: true
  fields:
  - name: RateLimit
    example: limit=400, remaining=399, reset=120
    spec: draft-ietf-httpapi-ratelimit-headers (RateLimit field, list-of-quota-policy form)
  - name: RateLimit-Policy
    example: 400;w=120
    spec: draft-ietf-httpapi-ratelimit-headers (RateLimit-Policy)
  retry_after: not observed
  legacy_x_ratelimit: false
  note: >-
    The values observed anonymously (400 requests / 120 second window) are the edge/abuse budget on
    api.sniffcat.com, NOT a documented plan tier. The documented per-role daily quotas below are a
    separate, additional meter.
