  admitted_from: Add-API gate auto-publish 2026-08-19 02:45 UTC, confidence 88.
  slug: No rename needed — sniffcat.com already yields sniffcat under the domain rule.
  split_surface:
    api.sniffcat.com: root 200 returning {"success":true,"status":200,"version":"0.1.5"}, invented path
      404 — discriminates. /api/v1 is the real surface.
    sniffcat.com: USER-AGENT FILTERED, not blocked. A default curl/SDK/agent UA gets a 5,511b Cloudflare
      "Attention Required" 403. The same URL with an ordinary Chrome UA returns 200 — the API documentation
      page is 10,853b of real HTML. Any agent, SDK or crawler sending its own UA is refused; a browser
      is not. An agent-readiness gap, and cheap for them to close.
    no_llms_txt: 'Established only after the UA correction: with a browser UA, /llms.txt and /openapi.json
      both return honest 404s. The 403 had masked their absence.'
  no_openapi: None published on either host. The pipeline deliberately derived none — there is no openapi/
    directory here.
  no_mcp_server_and_none_claimed: 'mcp/sniffcat-mcp.yml is status: candidate, published_by_provider: false.
    It records that /mcp 404s on both hosts, no MCP package exists on npm or PyPI, and no MCP server appears
    in the docs or the GitHub org. The tool set in it is an API Evangelist PROPOSAL and no MCPServer pointer
    is wired, because that pointer would assert an agent surface SniffCat does not serve.'
  correction: 'I first checked github.com/sniffcat — an org with 0 public repos — and concluded there
    was no ecosystem. Wrong org. The real one is github.com/SniffCatDB: 4 repos including a Python SDK
