aid: sniffcat
name: SniffCat
description: 'SniffCat is a privacy-focused IP abuse database and OSINT threat-intelligence platform built
  by Polish developer Sefinek, positioned as a community-moderated AbuseIPDB alternative. Sysadmins, hosting
  providers, ISPs and security researchers report malicious IP addresses against a published 27-term abuse-category
  vocabulary, and consume the resulting reputation data through a free, versioned REST API at api.sniffcat.com:
  abuse-confidence lookups, per-IP report history, and score-ordered blocklist feeds in JSON or plain
  text for direct firewall ingestion. Entitlement is role-based rather than paid, with published daily
  quotas per operation and trust levels that weight how much each reporter moves an IP''s score. The platform
  is in Early Access / open beta and publishes no machine-readable contract.'
