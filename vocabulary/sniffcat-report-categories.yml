method: searched
source: https://sniffcat.com/documentation/categories
summary: >-
  SniffCat publishes a complete, stable, numerically identified abuse-category vocabulary — 27 terms
  in 3 groups, each with an integer id, a severity weight and a definition. This is the controlled
  vocabulary behind the `categories` field on POST /api/v1/report and the `categories` filter on
  GET /api/v1/blacklist, and the severity weight is what feeds the abuse confidence score. It is the
  strongest machine-consumable artifact SniffCat publishes, even though it is published as an HTML
  table rather than as data.
term_count: 27
group_count: 3
weight_range: [6, 17]
usage:
  report_field: categories (array of ids, or comma-separated string; at least one required)
  filter_param: categories (comma-separated ids, maximum 5)
  effect: >-
    "Please note that categories affect the priority of reports." Each category carries a severity
    weight that contributes to an IP's abuseConfidenceScore.
  source: https://sniffcat.com/documentation
